<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Planner</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Profile Selection Screen -->
  <div id="profile-view" class="view-container active">
    <h1>Who are you?</h1>
    <div class="profiles-wrapper">
      <div class="profile-card" onclick="selectProfile('M')">
        <img src="imgM.png" alt="Profile M" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
      <div class="profile-card" onclick="selectProfile('N')">
        <img src="imgN.png" alt="Profile N" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
    </div>
  </div>

  <!-- PIN Entry Screen -->
  <div id="pin-view" class="view-container hidden">
    <h2 id="pin-prompt">Enter PIN</h2>
    <input type="password" id="pin-input" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="••••">
    <p id="pin-error" class="error-text hidden">Incorrect PIN. Try again.</p>
    <div class="button-group">
      <button onclick="goBack()" class="btn-secondary">Cancel</button>
      <button onclick="verifyPin()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- Main App Dashboard (Placeholder) -->
  <div id="main-view" class="view-container hidden">
    <h1 id="welcome-message">Welcome!</h1>
    <p>The gamified planner dashboard will go here.</p>
    <button onclick="logout()" class="btn-secondary">Log Out</button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
