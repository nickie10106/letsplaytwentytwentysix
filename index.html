<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src ="app.js"></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Profile Selection Screen -->
  <div id="profile-view" class="view-container active">
    <h1>Who are you?</h1>
    <div class="profiles-wrapper">
      <div class="profile-card" onclick="selectProfile('M')">
        <img src="imgM.png" alt="Profile M" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
      <div class="profile-card" onclick="selectProfile('N')">
        <img src="imgN.png" alt="Profile N" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
    </div>
  </div>

  <!-- PIN Entry Screen -->
  <div id="pin-view" class="view-container hidden">
    <h2 id="pin-prompt">Enter PIN</h2>
    <input type="password" id="pin-input" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="••••">
    <p id="pin-error" class="error-text hidden">Incorrect PIN. Try again.</p>
    <div class="button-group">
      <button onclick="goBack()" class="btn-secondary">Cancel</button>
      <button onclick="verifyPin()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- Main App Dashboard (Placeholder) -->
 <!-- Main App Dashboard -->
 <div id="main-view" class="view-container dashboard-view hidden">
    
    <!-- Top Pink Card (For Scores or Dual Timezones later) -->
    <div class="card pink-card">
      <!-- Content goes here -->
    </div>

    <!-- Green Countdown Card -->
    <div class="card green-card">
      <h3>Countdown till we meet again</h3>
      <!-- We can add a live JavaScript timer here later -->
    </div>

    <!-- Upcoming Events Section -->
    <div class="section-header">
      <h3>Upcoming Events</h3>
      <hr>
    </div>
    
    <!-- Empty space where the database will inject upcoming events -->
    <div id="upcoming-events-list" class="events-list">
    </div>

    <!-- Past Events Card -->
    <div class="card past-events-card">
      <div class="past-events-header">Past Events</div>
      <div id="past-events-list" class="past-events-body">
         <!-- Empty space where the database will inject completed events -->
      </div>
    </div>

   <!-- Floating Action Menu Container -->
   <div class="fab-container">
    <!-- The collapsible menu items -->
    <div id="fab-menu" class="fab-menu">
      <button class="fab-item" onclick="openEditEvent()" aria-label="Edit Events">
        <i class="fa-solid fa-square-pen"></i>
      </button>
      <button class="fab-item" onclick="openAddEvent()" aria-label="Add Events">
        <i class="fa-solid fa-calendar-plus"></i>
      </button>
    </div>
    <!-- The main toggle button -->
    <button id="fab-main-btn" class="fab-button" onclick="toggleFab()">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>
    
  </div>
</body>
</html>
