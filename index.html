<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Planner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Profile Selection Screen -->
  <div id="profile-view" class="view-container active">
    <h1>Who are you?</h1>
    <div class="profiles-wrapper">
      <div class="profile-card" onclick="selectProfile('M')">
        <img src="./img/1.png" alt="Profile M" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
      <div class="profile-card" onclick="selectProfile('N')">
        <img src="./img/2.png" alt="Profile N" class="profile-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23d1d1d1\'/></svg>'">
      </div>
    </div>
  </div>

  <!-- PIN Entry Screen -->
  <div id="pin-view" class="view-container hidden">
    <h2 id="pin-prompt">Enter PIN</h2>
    <input type="password" id="pin-input" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="••••">
    <p id="pin-error" class="error-text hidden">Incorrect PIN. Try again.</p>
    <div class="button-group">
      <button onclick="goBack()" class="btn-secondary">Cancel</button>
      <button onclick="verifyPin()" class="btn-primary">Login</button>
    </div>
  </div>

  <!-- Main App Dashboard -->
  <div id="main-view" class="view-container dashboard-view hidden">
    
<!-- Top Pink Card (Scoreboard) -->
<div class="card pink-card">
      
    <!-- Left Image (Floats freely) -->
    <img src="./img/1.png" alt="Big Dino" class="score-img-left" onerror="this.style.display='none'">

    <!-- Centered Text Area -->
    <div class="scoreboard-text">
      <div class="score-column">
        <div class="score-name">Big Dino</div>
        <div class="score-points" id="score-M">0</div>
      </div>

      <div class="vs-text">VS</div>

      <div class="score-column">
        <div class="score-name">Ginger</div>
        <div class="score-points" id="score-N">0</div>
      </div>
    </div>

    <!-- Right Image (Floats freely) -->
    <img src="./img/2.png" alt="Ginger" class="score-img-right" onerror="this.style.display='none'">
    
  </div>

    <!-- Green Countdown Card -->
    <div class="card green-card">
        <h3>Till the next time we're together.</h3>
        <div id="countdown-display" style="font-size: 24px; font-weight: bold; margin-top: 10px; display: flex; justify-content: space-around;">
          <div><span id="cd-days">00</span><div style="font-size: 12px; font-weight: normal;">Days</div></div>
          <div><span id="cd-hours">00</span><div style="font-size: 12px; font-weight: normal;">Hours</div></div>
          <div><span id="cd-minutes">00</span><div style="font-size: 12px; font-weight: normal;">Mins</div></div>
          <div><span id="cd-seconds">00</span><div style="font-size: 12px; font-weight: normal;">Secs</div></div>
        </div>
      </div>

    <!-- Upcoming Events Section -->
    <div class="section-header">
      <h3>Upcoming Events</h3>
      <hr>
    </div>
    <div id="upcoming-events-list" class="events-list"></div>

    <!-- Past Events Card -->
    <div class="card past-events-card">
      <div class="past-events-header">Past Events</div>
      <div id="past-events-list" class="past-events-body"></div>
    </div>

    <!-- Floating Action Menu Container -->
    <div class="fab-container">
      <div id="fab-menu" class="fab-menu">
        <button class="fab-item" onclick="openEditEvent()" aria-label="Edit Events">
          <i class="fa-solid fa-square-pen"></i>
        </button>
        <button class="fab-item" onclick="openAddEvent()" aria-label="Add Events">
          <i class="fa-solid fa-calendar-plus"></i>
        </button>
      </div>
      <button id="fab-main-btn" class="fab-button" onclick="toggleFab()">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

  </div> <!-- CRITICAL FIX: This tag now correctly closes the main-view -->

  <!-- Add Event Screen -->
  <div id="add-event-view" class="view-container hidden">
    <div class="view-header">
      <button class="back-btn" onclick="closeAddEvent()"><i class="fa-solid fa-chevron-left"></i> Back</button>
      <h2>New Event</h2>
    </div>

    <form id="add-event-form" onsubmit="saveEvent(event)">
      <label for="event-name">Event Name</label>
      <input type="text" id="event-name" required placeholder="e.g. R Studio Comp">

      <label for="event-type">Event Type</label>
      <select id="event-type" required>
        <option value="Competition">Competition</option>
        <option value="Lesson">Lesson</option>
        <option value="Activity">Activity</option>
      </select>

      <div class="form-row">
        <div class="form-group">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required>
        </div>
        <div class="form-group">
          <label for="event-time">Time</label>
          <input type="time" id="event-time" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="event-timezone">Timezone</label>
          <select id="event-timezone" required>
            <option value="SG">Singapore (SG)</option>
            <option value="LON">London (LON)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="event-points">Points Worth</label>
          <input type="number" id="event-points" required min="0" value="0">
        </div>
      </div>

      <button type="submit" id="submit-event-btn" class="btn-primary w-100" style="margin-top: 20px;">Save Event</button>
    </form>
  </div>
    
  <script src="app.js"></script>
</body>
</html>
